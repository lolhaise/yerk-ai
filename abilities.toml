[abilities.transcribe]
state = "built"
what = "The transcribe tool on Yerk's own MCP server: a voice note or recording in a room's own folders becomes text with a timestamp per segment, saved beside the audio as NAME.transcript.txt and returned to the room; a voice note's arrival line tells the room it hears the note only through this tool. The daemon runs it, since a room's shell has no network."
how = [
  "Chunks: ffmpeg cuts the audio into 14-minute mono mp3s, under both providers' 25 MB upload cap, sent in parallel.",
  "Pass 1: OpenAI whisper-1 on every chunk; a segment both near silence and low in confidence is dropped, the made-up line whisper writes over quiet.",
  "Pass 2: with a Groq key, Groq whisper-large-v3-turbo on the same chunks, the two aligned word by word; a segment where they differ on more than 3 words in 10 is marked uncertain with both readings, so a room gives it as unsure.",
  "Speakers: with a Meta key, Meta's Muse Voice Transcribe in DIARIZATION mode says who talks when, on 540-second mono 16 kHz WAV windows starting every 450 s, so each shares 90 s with the next (one request takes 10 minutes at most). Its letters (A, B) hold for one request only, so they are reconciled across windows by the speaking time they share in each overlap, and each whisper-1 segment takes the letter covering most of it; the words and their times stay whisper-1's. Letters, not names: the file's speakers line tells the room to say who is who as a guess unless the owner says. One voice writes no letters; a missing key or a failed window leaves the words unlabelled and the speakers line says why.",
  "Spend: every paid call is a spend row in the ledger, the morning diff says the day's total, and a recording past US$1 waits for the owner's yes.",
]
tier = "key"
keys = ["openai"]
provider = "OpenAI, Groq for the second pass, and Meta for the speakers"
model = "whisper-1, then whisper-large-v3-turbo, and muse-voice-transcribe-1.0 for the speakers"
needs = "ffmpeg on the machine; the install's OpenAI key (secrets/openai.key in the private folder, the one embeddings use); a Groq key at secrets/groq.key for the second pass, optional; a Meta key at secrets/meta.key for the speaker letters, optional"
price = "US$0.006 a minute on OpenAI (its pricing page) and US$0.04 an hour on Groq, 10 s billed at least per call (its speech-to-text page), both read 2026-10-21; US$0.18 an hour of audio on Meta's Muse, no least (its speech-to-text page, read 2026-09-27), about 1.2 times the recording since the windows overlap: a 7-minute voice note is about 6.8 US cents with all three, a 70-minute meeting about 72"
key = "put each key on the first line of its own file in the private folder's secrets/, 0600: openai.key, and groq.key and meta.key, both optional; the next call reads it, no restart"
free_path = "none: without the OpenAI key the room says the note could not be transcribed and answers from the message text"
asked_as = ["transcribe", "transcription", "transcribe this", "what does this recording say"]

[abilities.voice_note]
state = "built"
what = "The voice_note tool on Yerk's own MCP server: a script the room writes, when the owner asks for a voice note or to say it out loud, becomes a spoken note in the room's own work folder, checked before it is handed back, which `send` posts as a Discord voice message. The daemon runs it, since a room's shell has no network."
how = [
  "Script: `[[pause]]` alone on a line is a section break, each section its own call joined by half a second of silence, a section over 4,000 characters split again at its paragraphs; `(break)` is a short pause; a section under 50 characters joins the next with a `(break)`, since a voice glues a stray syllable to a short one.",
  "Voice: MiniMax speech-2.8-hd (English_FriendlyPerson, speed 1.18) first, with the private folder's pronunciation rules; on any MiniMax failure the whole note goes to Fish Audio s2.1-pro-free, so a note never changes voice mid-way. Mood tags in brackets are dropped for MiniMax and passed to Fish.",
  "Sound: loudness to -14 LUFS, then opus at 48 kHz in an ogg file, what Discord plays as a voice message.",
  "Check: the first 20 seconds are read back by whisper-1 and must match the script's opening; a note that does not is deleted and the room told, so a note is never handed back unheard.",
  "Send: `send` posts it with no text as a voice message (flag 8192, its duration and waveform); one Discord refuses goes as the plain audio file, and the room says so.",
  "Spend: every paid call is a spend row in the ledger, the morning diff says the day's total, and a note past US$1 waits for the owner's yes.",
  "English only: both voices and the check are English; another language needs other voices and another check.",
]
tier = "paid"
keys = ["openai", "minimax|fish"]
provider = "MiniMax, and Fish Audio when MiniMax fails"
model = "speech-2.8-hd, then s2.1-pro-free; whisper-1 for the check"
needs = "ffmpeg on the machine; a MiniMax key at secrets/minimax.key and a Fish Audio key at secrets/fish.key in the private folder (either one makes notes, MiniMax first); the install's OpenAI key (secrets/openai.key) for the check; pronunciation rules in voice/pronounce.txt there, one word/say-it a line, optional"
price = "US$100 a million characters on MiniMax speech-2.8-hd (its pay-as-you-go pricing page) and US$0 on Fish Audio s2.1-pro-free (its pricing page), both read 2026-10-22, plus US$0.002 for the 20-second check on whisper-1: a 1,000-character note is about 10 US cents"
key = "put each key on the first line of its own file in the private folder's secrets/, 0600: minimax.key and fish.key; the next call reads it, no restart"
free_path = "a text reply"
asked_as = ["voice note", "voice message", "send me audio", "say it out loud"]

[abilities.render]
state = "built"
what = "The render tool on Yerk's own MCP server: a document in a room's own folders (a Word file, a spreadsheet, a slide deck or anything LibreOffice opens) becomes a PDF saved beside it as NAME.pdf and its page count comes back to the room, so it can say whether the document fits a page count and send the PDF; a PDF has its pages counted alone. The daemon runs it, since LibreOffice keeps its pipe in a /tmp a room's sandbox cannot write."
how = [
  "Render: `soffice --headless --norestore --nologo --convert-to pdf --outdir <its folder> <the file>`, run by the daemon off its loop; an older NAME.pdf there is replaced.",
  "Fresh profile: each call gets its own LibreOffice profile in the state folder's render/, 0700 with a random name, removed after whatever happens, so two calls never share one and none leaves a stale lock; the environment is clean, HOME the profile, with the owner's own fonts still found.",
  "One at a time: one conversion runs at a time across rooms, since LibreOffice is heavy; a second call waits its turn and never fails for it.",
  "Timeout: a conversion past 120 seconds is killed with its whole process group, and the room is told LibreOffice did not finish.",
  "Count: pypdf counts the PDF's pages; a .pdf path is counted alone, nothing run.",
  "Layout: LibreOffice's, not Word's, so a document that fits by a line in one can spill in the other; a result near the edge is said as near the edge.",
]
tier = "free"
needs = "LibreOffice on the machine: `soffice` on PATH"
price = "none"
free_path = "none: without LibreOffice the room says so"
asked_as = ["render to pdf", "docx to pdf", "how many pages", "does it fit on one page", "page count"]

[abilities.watch]
state = "built"
what = "The watch tool on Yerk's own MCP server: a video in a post (an Instagram reel or post, a TikTok, an X post, a YouTube link or any page yt-dlp knows) is pulled from its link into the room's own work folder, with still frames the room opens with Read and a transcript of its sound, so a room sent a video link answers off the video, never off the caption, the cover picture and the comments. The daemon runs it, since a room's shell has no network."
how = [
  "Pull: `yt-dlp --no-playlist --restrict-filenames --max-filesize 300M -f \"bv*[height<=720]+ba/b[height<=720]/b\" --merge-output-format mp4` into videos/<site>-<the post's id>/ in the room's work folder, run by the daemon off its loop in a clean environment: the best picture at 720 lines or under with its sound, and a video past 300 MB is skipped and said.",
  "One at a time: one download runs at a time across rooms, a second call waiting its turn and never failing for it; one past 300 seconds is killed with its whole process group, and the room is told it did not finish.",
  "Frames: ffprobe reads its length and its streams, then ffmpeg takes the frames asked for (6, or 1 to 12) spread evenly through it, JPEGs at most 1280 wide named by their number and time, an older set replaced; a video with no picture has none.",
  "Captions first: with no transcript beside the video, `yt-dlp -J --skip-download` (about 2 s, nothing downloaded) reads the page's caption tracks, and one is fetched: the video's own language, an uploaded track over an auto-generated one, the untranslated auto track (<lang>-orig) over its plain one, never live chat and never a translation. Exactly one key a call, named only after -J showed it, since a pattern or a list reaches YouTube's auto-translated tracks and it answers HTTP 429. The json3 file it saves is read into the transcript's own lines, [HH:MM:SS -> HH:MM:SS] with the captions' timestamps under the same head line, saved as the transcript beside the video and then deleted; the result's `source` says captions or auto-captions. A video past the size cap still returns its captions, and only a video with no track goes to the paid transcription.",
  "Transcript: a video with no captions has its sound go through the transcribe engine on its keys and its US$1 gate, each paid call a spend row under watch, saved beside the video; with no sound, or a transcript that fails, the frames still come and the result says why.",
  "Never twice: a post already pulled is not pulled again, and its transcript is read from its file, so a second call costs nothing.",
  "In the site's words: a page that needs a login, a private post or a page with no video is said as yt-dlp says it; no cookies and no logins are used.",
  "A file: a video file sent to a room is watched from its saved path the same way, nothing pulled (yerk explain video-file).",
]
tier = "key"
keys = ["openai"]
provider = "OpenAI for the transcript, with transcribe's Groq and Meta keys when they are there"
needs = "yt-dlp, ffmpeg and ffprobe on the machine, on the daemon's PATH; the OpenAI key for the transcript"
price = "the download, the frames and a video's own captions are free; a video with no captions at transcribe's prices (yerk explain transcribe): a 1-minute reel is about 1 US cent with all three engines, a 10-minute video about 10"
key = "the transcript runs on transcribe's keys, in the private folder's secrets/: openai.key, and groq.key and meta.key, both optional; the next call reads it, no restart"
free_path = "the frames, and the words of any video that has captions, come without a key; without yt-dlp the room says so"
asked_as = ["watch this", "what does the video say", "this reel", "this tiktok", "the video he sent", "what happens in it", "read the whole podcast", "what does he say in this video", "the transcript of this youtube"]

