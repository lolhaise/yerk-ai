[abilities.text]
state = "built"
what = "The text tool on Yerk's own MCP server: a room the owner asks to text someone sends one text in the owner's name, an iMessage or else an SMS, from the owner's own Mac, to that person's phone number or email address. Nothing goes before the owner has seen it: the call is held in the room with its words and who it goes to shown as they will read, and it goes once, on the owner's approval word; an edit is a new preview. The daemon sends it, since a room's shell has no network and plain ssh holds no grant to drive Messages."
how = [
  "Preview first: the text-out gate holds each call and shows the room its words and who it goes to, never its JSON; the owner's approval word releases that exact call once, and the daemon sends only a call the gate released, so a rule turned off or a hook that failed open sends nothing.",
  "Before the ask: a person's room, an install with no Mac set up, a name in place of a number or an address, or an empty text is refused at the gate, so the owner is never asked to approve a text that could not go.",
  "The way to the Mac: ssh to [imessage] host, then socat to the socket of the Mac's bridge, a small app there that holds Messages' grants and serves imsg's JSON-RPC; a status first, then one send of the number or address, the text and the service (auto by default: iMessage where the person has it, else SMS through the phone), on a connection of its own.",
  "Told apart: no answer to the status, or an error to the send, is not sent; no answer to the send, or the bridge's own may-have-completed answer, may have gone out, and the room says so and never sends it again unasked.",
  "Receipt: each text's outcome is a gate row after its hold, the word and the release, with who it went to, its length and the id Messages gave it.",
]
tier = "free"
needs = "a Mac signed into the owner's Messages (the phone's text forwarding on, for SMS), the bridge app on it, and an ssh path from the box: [imessage] host and socket in yerkd.toml"
price = "none"
free_path = "this is the free path"
asked_as = ["text her for me", "text him for me", "text them for me", "send a text for me", "send an imessage", "text from my phone"]

[abilities.delete-outside]
state = "built"
what = "The delete tool on Yerk's own MCP server: a room the owner orders to delete files or folders outside its work folder (old crash dumps, a full trash, old backups, to free the disk) names their whole paths, and the daemon deletes them for good, not to the trash, once the owner has read each path in the room and said the approval word; a room's shell deletes only inside its work folder, and Claude Code's sandbox keeps the rest of the disk read-only to it."
how = [
  "Shown first: the delete-outside gate holds each call and shows the room every path whole with what it is (a file and its size on disk, a folder, a link); the owner's approval word releases that exact call once, and the daemon deletes only a call the gate released, so a rule turned off or a hook that failed open deletes nothing.",
  "Before the ask: a person's room, a path that is not whole, not there or not its own real path (a link or a `..` on its way, so the path shown is the path deleted), the root, a top folder, the home folder, a mounted disk or a folder holding one, and Yerk AI's own folders (its code, its state and private folders, the memory, an account's folder) or one holding them are refused at the gate, so the owner is never asked to approve a delete that would not run.",
  "The delete: each path checked again, a file or a link unlinked (never the file a link points to), a folder removed whole without following a link inside it; what each took on disk counted, so the result says the space freed, and anything that would not go is named with the reason.",
  "The wall: a room's own `rm` outside its work folder is still refused, and in an owner room the refusal names the delete tool; a worker and a person's room keep the old refusal.",
  "Receipt: each delete's outcome is a gate row after its hold, the word and the release, with how many paths went, the space freed and the paths.",
]
tier = "free"
needs = "nothing"
price = "none"
free_path = "this is the free path"
asked_as = ["delete files outside", "free up disk space", "clean up my disk", "delete old backups", "empty the trash", "delete crash dumps"]

