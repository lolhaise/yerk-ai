state = "built"

[abilities.schedule]
what = "The schedule tool in every room, and `yerk schedule`: add a one-shot or a recurring job (a name, when with a zone, what, how to deliver), remove one, list them; writes the jobs file, syncs the timers and answers with the next fire time read back from systemd. A missing zone is the room's configured one, never UTC by accident."
tier = "free"
needs = "the jobs ability"
free_path = "this is the free path"
layer = 5
state = "built"

[abilities.room-settings]
state = "built"
what = "The owner changes a room's model, thinking level and account from the room in plain words (\"put this room on Opus at max thinking on account three\"): the settings tool takes a model from the install's list (an alias or its full id), a level (low, medium, high, xhigh, max, or default) and an account by its accounts.toml name (or default), answers with one line, and the next reply runs on them in the same conversation, never mid-turn. The account is tried first, the room's order behind it; when the session cannot move to it, a new one starts with a recap and the line says so. Owner rooms only; any other room is told only the owner's rooms can change this. The choice is the daemon's own file under the state folder, over rooms.toml, which is never written, and it survives a restart; `yerk config get room NAME` shows the model and level and where each comes from. On Discord the same is /model (a model, an account) and /effort, beside /new (a fresh session, memory kept), /stop (the running turn ends now, for good) and /status (the card): the owner's only, seen by the owner alone."
tier = "free"
needs = "nothing; the model list is models.toml in the package (alias = full id), replaced whole by [models] in yerkd.toml"
free_path = "this is the free path"
asked_as = ["change your model", "switch your model", "change the model", "switch the model", "thinking level"]

[abilities.retention]
state = "built"
what = "Keeps the state folder from growing forever: `yerk retention` runs each night (units/yerk-retention.timer) and keeps a room's stream log and assembled log 14 days, gzipped a day at a time; a room's Claude Code transcripts 30 days after their last write, and never the session the room is on, one written in the last 24 hours or one of a room mid-turn or with a message waiting; the ledger's timing rows 90 days; a finished worker's folder and its transcript 30 days; a room's scratch, its work folder but the person's files and the copies of what it sent, 2 days, and past 500 MB its oldest files first, never one written in the last hour or while the room has a turn running. Nothing is deleted on the spot: what leaves waits 7 days in the state folder's trash, a room's scratch 1 day, so a wrong rule costs a week (scratch: a day), not data. It never touches the memory tree, the private layer, a room's attachments or a file still open. The days are [retention] in yerkd.toml; `yerk retention --dry-run` says what would go and how much, and the morning diff says what went."
tier = "free"
needs = "a systemd user timer (units/yerk-retention.timer) and Linux /proc, which says what is still open"
free_path = "this is the free path"
asked_as = ["how long do you keep", "retention sweep", "your trash folder"]
layer = 11
