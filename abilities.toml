what = "Scheduled jobs from one private jobs.toml: `yerk jobs sync` makes one systemd user timer and service per job (idempotent: unchanged left alone, changed rewritten, removed disabled and cleaned), shows the diff and reads every next fire time back from systemd; `yerk jobs list` is the read-back. Three schedules (a cron expression with a tz, an interval, a one-shot that is removed after it fires), three kinds: a script (its command run in the unit with no account, its output posted to the room; exit 0 with nothing posts nothing; a failure alerts the ops room), an agent job (a worker with the message as its brief, its last message told by the room, exactly NO_REPLY for silence) and a note (a reminder: when it is due the room's own session is told its message and says it in its voice; no worker, shell or account, and one missed while yerkd was down is told at its next start). Every run is a job_runs ledger row; `yerk status` lists the jobs with their next fire time. `yerk explain jobs` describes every key of the file."
tier = "free"
needs = "systemd user timers (systemctl --user, systemd-analyze); a running yerkd for the delivery and for agent jobs; the jobs file in the private folder (examples/private/jobs.toml is the template)"
free_path = "this is the free path"
layer = 5
state = "built"

[abilities.schedule]
what = "The schedule tool in every room, and `yerk schedule`: add a one-shot or a recurring job (a name, when with a zone, what, how to deliver), remove one, list them; writes the jobs file, syncs the timers and answers with the next fire time read back from systemd. A missing zone is the room's configured one, never UTC by accident. Any room adds, lists and removes its own notes; agent and script jobs run as the owner, so only the owner's rooms set them."
tier = "free"
needs = "the jobs ability"
free_path = "this is the free path"
layer = 5
state = "built"

[abilities.room-settings]
state = "built"
what = "The owner changes a room's model, thinking level and account from the room in plain words (\"put this room on Opus at max thinking on account three\"): the settings tool takes a model from the install's list (an alias or its full id), a level (low, medium, high, xhigh, max, or default) and an account by its accounts.toml name or its digit (or default), answers with one line, and the next reply runs on them in the same conversation, never mid-turn. The account is tried first, the room's order behind it; when the session cannot move to it, a new one starts with a recap and the line says so. Owner rooms only; any other room is told only the owner's rooms can change this. The choice is the daemon's own file under the state folder, over rooms.toml, which is never written, and it survives a restart; `yerk config get room NAME` shows the model and level and where each comes from. On Discord the same is /model (an account, a model or both, suggested to the owner as they type) and /effort, beside /new (a fresh session, memory kept), /stop (the running turn ends now, for good) and /status (the card): the owner's only, seen by the owner alone."
tier = "free"
needs = "nothing; the model list is models.toml in the package (alias = full id), replaced whole by [models] in yerkd.toml"
free_path = "this is the free path"
asked_as = ["change your model", "switch your model", "change the model", "switch the model", "thinking level"]

[abilities.retention]
state = "built"
what = "Keeps the state folder from growing forever: `yerk retention` runs each night (units/yerk-retention.timer) and keeps a room's stream log and assembled log 14 days, gzipped a day at a time; a room's Claude Code transcripts 30 days after their last write, and never the session the room is on, one written in the last 24 hours or one of a room mid-turn or with a message waiting; the ledger's timing rows 90 days; a finished worker's folder and its transcript 30 days; a room's scratch, its work folder but the person's files and any top folder holding a file named KEEP, and the copies of what it sent, 2 days, and past 500 MB its oldest files first, never one written in the last hour or while the room has a turn running; a swept room finds what went where, and for how long, in its work/RETENTION.md. Nothing is deleted on the spot: what leaves waits 7 days in the state folder's trash, a room's scratch 1 day, so a wrong rule costs a week (scratch: a day), not data. It never touches the memory tree, the private folder, a room's attachments, a KEEP folder or a file still open. The days are [retention] in yerkd.toml; `yerk retention --dry-run` says what would go and how much, and the morning diff says what went and from which room's folders."
tier = "free"
needs = "a systemd user timer (units/yerk-retention.timer) and Linux /proc, which says what is still open"
free_path = "this is the free path"
asked_as = ["how long do you keep", "retention sweep", "your trash folder"]
layer = 11

[abilities.claude-docs]
state = "built"
what = "Knows its own harness from the source: `yerk docs` keeps the Claude docs Yerk runs on (the prompting guide, each model's prompting page, the Claude Code pages on settings, hooks, memory, sandboxing, MCP, the command line and the system prompt flags) in the state folder as a memory root of class shared, so every room's own recall finds them, below the owner's notes, and cites docs/claude/<slug>.md:line; what a room is handed per message never holds them. `yerk doctor` fetches them from the web once a week ([docs] refresh_days in yerkd.toml, 7; [docs] fetch = false turns that off, and `yerk docs refresh` still fetches when run; [docs] pages replaces the list), and a page whose content changed is a line in the morning diff, since a changed guide means the rules may be stale against it."
tier = "free"
needs = "web access for the weekly refresh; the pages are indexed like any memory file"
free_path = "this is the free path"
asked_as = ["claude docs", "what the docs say", "the prompting guide"]
command = "docs"

[abilities.harness-code]
state = "built"
what = "Reads Yerk's own code, the checkout that runs: every owner room's Read, Grep and Glob reach it and the mechanics name its path, so a worker's claim about Yerk (a flag it says is passed, a check it says runs) or a question on how Yerk does a thing is checked against the code before it is said, never relayed on a report's word. The daemon writes the read rule into each owner room's settings at its process start: the checkout whole, or each of its entries around the private and state folders when it holds one, the secrets' denies still beating it; a rule and never an added folder, since Claude Code's sandbox opens an added folder to the room's shell for writing. A room whose privacy is not owner reads its own folders only, as before."
tier = "free"
needs = "an owner room with Read, Grep or Glob in its tools; nothing to set"
free_path = "this is the free path"
asked_as = ["read your own code", "read the harness code", "check the code yourself", "check a worker's claim", "yerk's code"]

[abilities.rule-shape]
state = "built"
what = "Checks how its own rules are written: the doctor scores every rule file a room loads (the mechanics, its persona, rulebook and voice, the rules file) against the prompting guide, counting negatives with no why, shouted words, examples outside example tags, alarm marks on an instruction and topics said in two files. A count past budgets.toml [shape] is a finding, a rule filed in the last day that misses the shape is named by its cite, each room's report is docs/shape/<room>.md, the morning diff carries the totals, and `yerk docs shape` prints the report with each count's exact rule."
tier = "free"
needs = "nothing; it runs in the daily doctor (units/yerk-doctor.timer)"
free_path = "this is the free path"
asked_as = ["rule shape", "are your rules written", "how your rules are written"]
command = "docs shape"

[abilities.web]
state = "built"
what = "Web reach for the rooms that attach it, as one plug-in outside the harness (plugins/web, an MCP server): web_fetch reads a page with a plain read from the machine first, then its own stealth browser and captcha solver when they are installed, then a paid cloud browser, names the wall when a page stays shut (a login, a captcha, a region) and remembers per site which step read it; web_search asks a paid engine first and keyless ones behind it; web_research runs one cited research job at a fixed price; web_image saves one picture from a post or a page (a jpeg, png, gif or webp, read plainly from the machine first and by the paid cloud fetch only when a site refuses that) into the room's work folder, where the room's Read shows it; every paid call is a spend row, and the morning diff says the day's total."
tier = "free"
needs = "Node 22.13 or newer and `npm ci --omit=dev` once in plugins/web; the room's mcp table naming plugins/web/server.mjs with --private (rooms.toml.example); every key is optional"
price = "nothing without keys; with them, each provider's own price, paid to it (October 2026): a search about 0.7 US cents on Exa or 0.1 on Parallel, a cloud-browser read inside its plan's included calls and hours, a research run 1.2 to 50 US cents by effort under one daily cap of two US dollars for every room"
key = "each key in its own file in the private folder's secrets/, 0600: exa.key (search and research), parallel.key (search), browserbase.key and browserbase-project.id (the cloud browser); the next call reads it, no restart"
free_path = "a plain read and the machine's own browsers for pages, You.com's and Parallel's keyless engines for search; research needs its key"
asked_as = ["web reach", "blocked page", "bot wall", "captcha page", "page will not load", "search api", "paid search", "search provider", "deep research", "research agent", "web research", "exa agent", "verify and enrich"]

[abilities.bookings-guest]
state = "built"
what = "Reads a Microsoft Bookings page (Bookings with me) the way a guest sees it, with no sign-in: web_fetch adds the anonymous flag every share link Microsoft makes carries when a link lacks it, so no rung lands on Microsoft's sign-in, and the machine's own browser clicks Continue as guest on the page's sign-in-or-guest screen and reads the meeting types and open times that click brings; a page still on that screen, or whose guest view goes on to a sign-in, is named so, with the next move, never as a login to save, and no paid rung runs for it."
tier = "free"
needs = "the web ability's plug-in attached to the room and the machine's own browser (F2) installed; no account, no key and no sign-in"
free_path = "this is the free path"
asked_as = ["bookings page", "bookings with me", "bookwithme", "microsoft bookings", "booking page slots"]
