how = [
  "Compile: `latexmk -norc -pdf -interaction=nonstopmode -halt-on-error -file-line-error -no-shell-escape -outdir=<a fresh build folder> NAME.tex` from the document's folder, reruns, cross-references and the bibliography included, run by the daemon off its loop; only a clean run's PDF is copied out beside the .tex, over any older NAME.pdf, a link left at that name replaced and never written through.",
  "Program: the file's own `% !TEX program =` line (pdflatex, xelatex or lualatex), else lualatex when it or a class or package file beside it runs Lua, xelatex when one loads fontspec, unicode-math or polyglossia, else pdflatex, the online editors' default.",
  "Sandbox: bubblewrap, as the live page's tests run: no network, no home, state or private folder, the document's folder read-only, a fresh build folder under the state folder's render/ the one thing writable and removed after, shell escape off; with no bwrap that starts nothing runs, and the room is told.",
  "Work folder only: a .tex elsewhere in a room's folders is refused in words, since its folder is what the sandbox shows and a room's layer can be the private folder itself.",
  "Errors: a failed run comes back as TeX's first error with its file and line (`NAME.tex:12: Undefined control sequence. (l.12 ...)`), never a path.",
  "One at a time: with LibreOffice's conversions, across rooms; a run past 120 seconds is killed with its sandbox, and the room is told LaTeX did not finish.",
  "Count: pypdf counts the PDF's pages, as for any render.",
]
