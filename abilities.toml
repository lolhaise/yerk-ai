# Every ability Yerk AI has or knows how to build, what it needs and what it costs, one entry per ability. The program
# tier: "free" runs on the box; "key" needs a provider key the user adds; "paid" is metered or a
# subscription, with the provider and the price named. `free_path` is what runs without the key or
# the payment, or "none". Abilities still to come say so in `layer`.
# state: "built" ships in this repo; "described" is known and not built (decision 26): it says what
# it is, `how` it would be built, what it would need and cost, and `why_not`. `yerk abilities` shows
# it as known, not built; `yerk explain` and a room message naming one of its `asked_as` phrases
# get the same answer from this file. A described ability becomes built only by a pull request
# with its own acceptance measurement.
# keys: a key-tier ability is on when each key named is in the private folder (openai: the install's OpenAI key file,
# [memory] embeddings_key; github: the pipeline's token, secrets/github.token; any other NAME: secrets/NAME.key; "a|b":
# either), looked at, never read.
# An add-on (README "Add-ons") is an entry with `repo` (its git URL), `version`, `size` (its own ceiling, in lines of
# code) and `install` (what `yerk add` does: its package and module, its mcp server and allow lines, its yerkd.toml
# settings, its room_keys, units, budgets lines, words file and tests). Its state is read from what is installed:
# installed, missing a part, or, with a repo named and nothing installed, not installed. examples/addons/hello is one.

[abilities.voice]
state = "described"
what = "Voice rooms: the owner talks to Yerk out loud, in a voice channel or on a call, and Yerk talks back in the room's own voice."
how = [
  "A voice room: one room entry per voice channel or call line, with the same account order, budgets and privacy class as a text room.",
  "The realtime speech vendor as a tool: it turns speech into text and the reply into speech, and never decides what is said.",
  "Claude Code supplies the words: each finished utterance goes into the room's session as a message, and the reply's text is what gets spoken.",
  "Barge-in from the user's transcript: human speech stops playback, a transcript that stops mid-thought is held until the thought ends, and a reply that newer speech supersedes is dropped.",
  "Audio streams as it is synthesized, and one reply is asked for at a time, so a slow answer is never asked for twice.",
  "Call close and stop events go to the normal log, and a reconnect picks up from a short recap plus the call's key turns.",
  "Control words (end the call, keypad digits) are read before any content filter.",
]
tier = "paid"
provider = "a realtime speech vendor (speech to text and text to speech)"
needs = "a voice channel or a phone line the harness can join, a realtime speech vendor's key in the private folder, and the room's Claude Code subscription for the words"
price = "the speech vendor's per-minute price for listening and speaking, paid to the vendor; no vendor is chosen, so no price is named here; the words cost nothing beyond the Claude subscription"
free_path = "none for live talk: text rooms are the free path"
why_not = "The owner's call: not worth shipping in the public harness. Realtime voice is hard to make good, most users never need it, and it would pull a paid vendor into the core. It stays described here so Yerk knows how it would work and can say so when asked."
asked_as = ["voice", "voice chat", "voice call", "speech", "talk out loud", "phone call"]
layer = 10

