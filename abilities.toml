needs = "TeX Live on the machine, on the daemon's PATH: latexmk and pdflatex, with xelatex or lualatex for documents that ask for them (Debian or Ubuntu: `apt install latexmk texlive-latex-extra texlive-fonts-extra texlive-xetex texlive-luatex`); and bubblewrap (`bwrap`), which a room's shell sandbox needs anyway"
