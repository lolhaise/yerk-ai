how = [
  "A named screen, on a Windows PC under WSL: Windows' own PowerShell opens the page's one-time address in a new window of the default browser (Chrome, Edge, Brave, Vivaldi, Opera or Firefox), the address in its environment, never on a command line; counts the screens from the left (middle the centre one, of two the right one, so a third screen asleep, which Windows can drop, leaves it the same; primary the main one); moves the window to that screen's work area, maximizes it there and raises it above the rest without taking the focus; and first wakes the display, a display-required request and a still mouse event: no click, no key, the pointer unmoved.",
  "Painted, said: the tab says when it drew a frame while it shows (a browser draws none on a covered window, a screen asleep or a locked one), and the open waits 10 s for it: painted, with the screen's rectangle for a desktop screenshot, else not painted and why (locked, or still asleep or covered), so the room never reads an old frame as the page.",
  "Told in words: a screen that is not there (with how many there are), a browser yerkd opens no window of, a window that never showed, a box that is not a Windows PC; the page then opens once at most, where the browser puts it, and only when nothing opened yet.",
  "The Mac: ssh to [page] mac in yerkd.toml (else [imessage] host, the text tool's Mac) runs `open` there on the page's one-time address, handed on ssh's stdin, so neither the key nor the ticket is on a command line; the address is [page] address, yerkd as the Mac reaches it (the box's tailnet or LAN host, its port yerkd's when it names none), else [page] listen's (page-reach), since 127.0.0.1 on the Mac is the Mac.",
  "Nothing set: with neither key, the Mac is the one an owner room's add-on reaches, `ssh` in the mac.json beside its server (the hands plug-in's, its mac tool's host), a host or user@host only, from a file of the owner's no other user writes and none under Yerk's state folder, where each room's folder is; the address is the box's own tailnet one (page-reach), so one restart of yerkd at a deploy lands the page on the Mac.",
  "Told in words: no Mac named, no address set, a Mac that does not answer over ssh or a `where` that is neither pc nor mac; the page is on all the same, and where pc opens it on the box's own screen.",
  "The reload: the tab keeps its room and key in its own session storage, never the address bar, the history or a bookmark, and gone when the tab closes, so a reload or a retyped /page in it opens the page again; an address that brings a ticket or a key wins.",
  "A tab with no key says a line typed there reached no room, keeps the words in the box and says how to open the page.",
]
