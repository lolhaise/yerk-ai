[abilities.needs]
state = "built"
what = "A room that hits a wall files what it needed with the `need` tool, and Yerk builds it once for every room. With [needs] auto (on unless set false) the pipeline runs one need at a time from filed to live with no person in the loop; the rest wait in a queue and the oldest starts when the one in flight is live, held or stuck."
how = [
  "Auto-start: a new need starts its builder worker when no need is in flight, else it is queued; a builder that fails starts once more, then the need is stuck.",
  "Outside Yerk: the box's sync pushes the builder's branch and opens its pull request, and the box's CI posts the checks on its head; the daemon only reads them.",
  "The fix loop: a red check starts a fix worker that adds a new commit to the branch, never an amend; past [needs] fix_cap fixes (default 2) the need is held for a person, and checks that never all come within [needs] checks_minutes make it stuck.",
  "The cold read: green checks start a fresh worker, never the builder, that reads the diff and says merge, fix first or unsure.",
  "The merge: the daemon merges the pull request only at the head the read saw (the sha guard); a moved head is checked and read again.",
  "The deploy: a merged need with no deploy running starts `yerk deploy origin/main` in a transient unit of its own after a fetch through the package's askpass, so the token never reaches a command line.",
  "Live: a proven deploy that holds the merge makes the need live, one line in the machine room and one in each room that filed it.",
]
tier = "free"
needs = "a GitHub token at secrets/github.token in the private folder, for the merge and the deploy's fetch"
free_path = "without the token the builds and the pull requests still happen, and the merge and the deploy wait for a person (`yerk needs done`, `yerk deploy`); live still follows the deploy"
asked_as = ["can you build what you need yourself", "does it auto build", "how do needs get built"]

# need-2026-11-02-36: a room's wall was a gate in a plug-in's own code, a local git repository outside this one, and the
# builder only ever edited Yerk's repo, so it described the fix as out of reach and the wall came back twice.
[abilities.plugin-builds]
state = "built"
what = "A need whose fix lives in a plug-in's own code is built there: an add-on whose code is a local git repository of its own (the browser plug-in kept outside this repo, say) is named in the builder's brief, the fix goes on a branch of the need's name in that repository, the cold read reads it with the pull request, and the merge lands it in the checkout the rooms run."
how = [
  "Found, not configured: each room's mcp server whose command or an argument is a file in a git checkout other than Yerk's own (nor the home folder) is a plug-in repository, on the branch that checkout is on.",
  "The build: the brief names each one and says a fix living in its code is built there, on the need's branch, with the plug-in's own tests, never described in abilities.toml as out of reach; the build's end finds the branch it left and the machine room's line says so.",
  "The read and the fixes: the cold read gets the plug-in branch's diff at its head and its tests to run, and a fix worker the branch to add a commit to; what the read read is what lands.",
  "The landing: the merge checks the branch is a fast-forward of the checkout the rooms run (the branch not moved, that checkout on its branch with nothing uncommitted) before it merges the pull request, then fast-forwards the checkout to the head the read saw; one that cannot land holds the need with why, and `yerk needs done` lands it on the hand road.",
]
tier = "free"
needs = "a plug-in attached in rooms.toml whose code is a local git repository, and the needs pipeline"
free_path = "this is the free path"
asked_as = ["fix the plug-in", "build it in the plug-in", "plug-in repo", "change the plug-in's code"]

# The described abilities below are known and not built (decision 26). On a described entry, `upgrade`
# names the built ability that already ships part of it.
# need-2026-11-09-78: a room's text was held, the owner said the word, and the same call, made again by a session a
# /compact had put back in its work folder, was held a second time on a second card, since the folder was part of what
# an approval matched. The folder now binds a shell command's approval only, built in this entry, which keeps its name,
# so the "what can you do" census (abilities.abilities) carries no new name past its 2,000 cap.
[abilities.gates]
state = "built"
what = "Rule-based gates on a room's tool calls, decided by code, so they block. A delete (rm, rm -r, unlink) runs as the trash with the same paths and the room is not told unless the trash fails; a command that never runs (a delete of the root, home or a system folder, mkfs, dd onto a disk, a fork bomb, a shutdown) is refused; shell text is read quote-aware first, so a rm in quotes, in a heredoc or in a sentence is not a delete. A write to yerkd.toml, rooms.toml or accounts.toml, or a restart of yerkd, is refused with one line while a person is mid-conversation or the memory index rebuilds. An external action (a send to another room, a public post, a login, money, a text or an email in the owner's name, a message out through another tool, a delete for good outside the work folder through the delete tool, or a rule in yerkd.toml [gates.external]) is held with one line until the owner says approve in the room, then that same call runs once: a tool's call from whatever folder the shell is in by then (a session resumed after a compaction is back in its work folder), a shell command only from the folder it was held in, since the same words do another thing elsewhere. A working turn that ends with nothing in the room bounces once, naming what it owes, and so does a final message that only reports a filing (remember, schedule, hold, settings) while the answer sits above the call or was never written, each such bounce a `stub` row the morning diff counts; a session that replaced another says so in the room; a changed settings file is a tamper row. Every decision, each tool call's time and failure and each hook call's own time are ledgered. The five judge-model reply gates (a model reading a reply before it goes out) are shadow-only: they ledger what they would bounce and block nothing until one shows under 1 in 10 false alarms on 100 cases and a known-good control passes. The first shadow rule is the check-is-the-read one: a claim about code, what is running, a decision or a file's contents with no run or read behind it in the turn is ledgered with the sentence and the tools the turn ran."
tier = "free"
needs = "nothing; a trash command (trash-cli or gio) for the rewrite, else a delete is refused with the trash line; the approval word, the approvers and extra external rules in yerkd.toml [gates]"
free_path = "this is the free path"
layer = 6

[abilities.trusted]
state = "built"
what = "A room with people that runs the owner rooms' tools: shell = \"trusted\" in its rooms.toml table lets it list Bash, Write, Edit and the rest, with the privacy wall kept by Claude Code's sandbox. Its shell runs inside a wall the daemon builds at each process start: the owner's whole home but the room's own folders (a key, an account's token file, a backup or the shell history included, which no list names), and wherever they are, every other entry of the private and state folders (the other layers, the memory folder, rooms.toml, imports; every other room's folder, the ledger), every memory root and every other room's layer and read folders, and projects/ under each account's folder (every room's transcripts), denied to the shell for reading and writing. No command runs outside the sandbox and the room does not start without it. Its layer, its work folder and the files people send it stay readable and writable, its outbox read only, the Python user site-packages readable; Write and Edit reach its layer and work folder only, and the gates run as in every room. Its own [rooms.NAME.sandbox] table may add denies and the network allowlist; any other key, an allow rule for the file tools, or a wall that cannot be built stops the start with one line. Workers, jobs, rules and settings changes stay the owner rooms'."
tier = "free"
needs = "Claude Code's sandbox (on Linux, bubblewrap and socat); shell = \"trusted\" and the tools in the room's rooms.toml table"
free_path = "this is the free path"
layer = 6

