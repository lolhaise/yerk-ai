# Scheduled jobs (example). A real private folder holds its own jobs.toml; `yerk jobs sync` turns it
# into one systemd user timer and service per job, `yerk jobs list` reads the next fire times back,
# and `yerk explain jobs` describes every key below in plain words. Rooms are names from rooms.toml;
# a schedule is a systemd calendar line (`man systemd.time`, never cron) read in `tz`, an IANA zone name.

[jobs.example-inbox-check]           # a script: no model call; its output is posted as it is
kind = "script"
schedule = "*-*-* *:00:00"           # the top of every hour
tz = "UTC"
room = "example-room"
cap = 5                              # minutes; a run past it is stopped and alerts
deliver = "announce"
command = "echo 'nothing new in the example inbox'"   # exit 0 with output posts it; with none, nothing; a failure alerts

[jobs.example-morning-brief]         # an agent job: a worker with this message as its whole brief
kind = "agent"
schedule = "Mon..Fri 07:30"          # 07:30 on weekdays
tz = "UTC"
room = "example-room"                # its card is here; its last message is told here by the room
account = "one"
effort = "high"                      # its worker's thinking level (and `model` its model); unset, the room's live ones
# addons = ["mcp__example-addon__read"]   # the room's own add-on tools its worker gets too, beside the room's worker_addons; checked when booked
cap = 20
deliver = "announce"
message = "Write the morning brief from the open loops and yesterday's daily log: three lines at most. Nothing worth saying: answer exactly NO_REPLY."

[jobs.example-heartbeat]             # an interval is a calendar step: every two hours, on the even hours in `tz`
kind = "script"
schedule = "0/2:00"
tz = "UTC"
room = "example-quiet"
deliver = "silent"                   # runs and is ledgered, posts nothing; a failure still alerts the ops room
command = "true"

[jobs.example-curate-rules]          # the nightly rules pass: merges, cuts, condensations and promotions of the rule files,
kind = "script"                      # numbered into <memory>/rules-proposals/<day>.md and never applied; the owner applies
schedule = "*-*-* 04:30"             # one with `yerk curate --apply DAY N`. 04:30, a quiet hour: the 06:30 morning diff
tz = "UTC"                           # lists the night's by kind and number (a real file: the owner's zone)
room = "example-room"
cap = 10
deliver = "silent"                   # the machine room gets its card once a day; a failure still alerts. No account: the
command = "yerk curate --rules || [ $? -eq 1 ]"   # pass is code; a worker curate starts runs on yerkd.toml [curate]
                                     # account. Exit 1 is proposals to read, never a failure; 2 (could not run) alerts

[jobs.example-reminder]              # a note: at its time the room's own session is told the message and says it
kind = "note"                        # no worker, shell, account or cap, so any room adds, lists and removes its own
at = "2099-01-02 09:00"              # a one-shot, removed from this file after it fires; read in `tz`, unless it has an offset
tz = "UTC"
room = "example-room"
message = "Remind them the example appointment is at 10:00."
