# The box's rooms.toml as it stood on 2026-10-23 (11:13), in shape: its six rooms, each key and table in the live file's
# order, the same allow lists in the same orders and the same mcp tables. Ids, paths and comments are stand-ins.
[rooms.yerk-test]
channel = "discord:101"
layer = "/srv/yerk-ai/examples/private"
model = "claude-opus-5-5"
effort = "max"
tools = ["Read", "Grep", "Glob"]
privacy = "owner"
timezone = "America/Toronto"
persona = "persona.md"
rulebook = "rulebook.md"
voice = "rooms/example-room.md"
pinned_memory = "memory/pinned.md"
daily_notes = "memory/daily"
recall_days = 2
open_loops = "memory/open-loops.md"
allow = ["mcp__hands__browser", "mcp__hands__desktop", "mcp__hands__mac", "mcp__hands__mail", "mcp__hands__discord", "mcp__web-ladder__web_fetch", "mcp__web-ladder__web_search", "mcp__web-ladder__web_research", "mcp__web-ladder__web_research_result", "mcp__web-ladder__web_image"]

[rooms.yerk-test.mcp.hands]
type = "stdio"
command = "/usr/bin/node"
args = ["/srv/hands-mcp/server.mjs"]
env = { YERK_ROOM = "yerk-test" }
timeout = 120000
alwaysLoad = true

[rooms.yerk-test.mcp.web-ladder]
type = "stdio"
command = "/usr/bin/node"
args = ["/srv/yerk-ai/plugins/web/server.mjs", "--private", "/srv/yerk-private", "--state", "/srv/state/yerk", "--room", "yerk-test"]
timeout = 180000
alwaysLoad = true

[rooms.yerk-ops]
channel = "discord:102"
layer = "/srv/yerk-ai/examples/private"
model = "claude-opus-5-5"
effort = "max"
tools = ["Read", "Grep", "Glob"]
privacy = "owner"
timezone = "America/Toronto"
persona = "persona.md"
rulebook = "rulebook.md"
voice = "rooms/example-room.md"
pinned_memory = "memory/pinned.md"
daily_notes = "memory/daily"
recall_days = 2
open_loops = "memory/open-loops.md"
role = "machine"

[rooms.work-on-yerk]
channel = "discord:103"
layer = "/srv/yerk-private/ben"
model = "claude-opus-5-5"
compact_window = 700000
effort = "max"
tools = ["Read", "Grep", "Glob", "Bash"]
privacy = "owner"
timezone = "America/Toronto"
persona = "persona.md"
rulebook = "rulebook-work.md"
voice = "rooms/work.md"
pinned_memory = "memory/pinned-work.md"
read = ["/srv/box/memory", "/srv/staging/work-1", "/srv/staging/work-2"]
allow = ["mcp__web-ladder__web_fetch", "mcp__web-ladder__web_search", "mcp__web-ladder__web_research", "mcp__web-ladder__web_research_result", "mcp__hands__browser", "mcp__hands__desktop", "mcp__hands__mac", "mcp__hands__mail", "mcp__hands__discord", "mcp__web-ladder__web_image"]
also = ["/srv/box/MEMORY.md", "/srv/box/memory", "/srv/yerk-private/imports/texts"]

[rooms.work-on-yerk.mcp.web-ladder]
type = "stdio"
command = "/usr/bin/node"
args = ["/srv/yerk-ai/plugins/web/server.mjs", "--private", "/srv/yerk-private", "--state", "/srv/state/yerk", "--room", "work-on-yerk"]
timeout = 180000
alwaysLoad = true

[rooms.work-on-yerk.sandbox]
enabled = true
autoAllowBashIfSandboxed = true

[rooms.work-on-yerk.sandbox.filesystem]
denyWrite = ["//srv/box/memory", "//srv/staging/work-1", "//srv/staging/work-2", "//srv/yerk-private/ben", "//srv/box", "//srv/staging", "//srv/yerk-private"]
denyRead = ["//srv/box", "//srv/staging", "//srv/yerk-private/memory", "//srv/state/yerk/memory"]

[rooms.work-on-yerk.sandbox.network]
strictAllowlist = true
allowedDomains = []

# The chat room's copy (in the live file this comment sits above work's hands table, which came later)

[rooms.work-on-yerk.mcp.hands]
type = "stdio"
command = "/usr/bin/node"
