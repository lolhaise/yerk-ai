# the 50 workbooks and PDFs in the owner rooms' inboxes: pypdf reads their PDFs at 0.5 to 0.8 s a page, and 8 of the 19 over
# 900 KB (29 to 131 pages) were still reading after 15 s. A message waits 30 s at most (files.WAIT); this bounds the rest.
chars = 200000
secs = 60

