[recall]
# The recall bench as a ratchet (memory.ratchet): every `yerk recall-bench` run adds its row to <state>/memory/recall-bench.jsonl
# and exits 4, and the budget test fails where the install's index is (it runs the bench, `yerk deploy`'s fast tests among them),
# when the top six is more than `slack` questions under the best of the four runs before it on the same questions, unless a
# note in `drops` names that drop: "YYYY-MM-DD: BEST to NEW, why". A run at NEW less the slack or more passes while BEST is in
# the window; it leaves after four runs.
slack = 1
drops = [
    "2026-10-22: 116 to 98, the index grew under the bench from Oct 19 to Oct 21 (the import put 259 days of old chats in the day logs, 126,415 chunks; the texts, mail, wiki and Workbot roots and five more): 18 answers crowded out of the top six, every one still whole in one chunk; Oct 19's code scores today's index the same 99 of 164 as today's; the record weight gives 6 back",
]

