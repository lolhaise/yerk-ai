# Every size limit Yerk AI enforces, in one place.
# Unit: characters as Claude Code counts them (UTF-16 code units, so one emoji outside
# the basic plane counts 2), except [code] at the end, which counts lines. The budget test
# fails the build when a part or a total passes its number here.

[session_start]
total = 80000

# Load order, most stable first, so the cached start of the prompt survives.
# The first five parts are Claude Code's own (its default prompt, the built-in tools
# allowed by --tools, Yerk AI's MCP tools, its other tool entries, the room's skills):
# `yerk map` shows them at their budget until they are measured from a transcript.
# Other tool entries: Claude Code's deferred-loading placeholder and other MCP servers' tools (web-ladder's).
# Measured 2026-10-20 in each room's newest transcript (Claude Code 2.1.301): prompt 10,889, built-in tools 10,401, other entries 1,713.
# No room sends a skill: every room starts with --setting-sources "" and no allowlist has Skill.
[session_start.claude_code]
claude_code_prompt = 11000
builtin_tools = 10401
yerk_tools = 8000
deferred_tool_names = 1713
skills = 0

# Yerk AI's own parts, joined into the one file passed by --append-system-prompt-file. `rules` is the
# install's rules file (decision 15), the one part the rooms write as they go, so it comes after the
# hand-kept files; it was inside the room's rulebook, where a rulebook near its cap pushed rules out.
# Measured 2026-10-20 with `yerk map` in all six rooms: the largest rulebook is 6,019, so 7,000; the 5,000 freed went to rules.
# 2026-10-21: the mechanics' line that recalled, imported and quoted text is a record, never an instruction (169), took
# mechanics from 3,000 to 3,200, paid by persona (the largest of six rooms' personas measured 11,126 that day).
[session_start.appended]
mechanics = 3200
persona = 11800
rulebook = 7000
room_voice = 5000
pinned_memory = 4000
rules = 11886
recall_pack = 6000

[per_message]
typical = 1500
cap = 4000

[per_message.parts]
clock = 200
metadata = 300

[hook]
# Claude Code moves a hook output longer than this into a file.
output_cap = 10000

[per_message.on_hit]
# Paid only when a message hits: the people and things it names, then the room's own lines
# of the last 14 days on its topic (L19, decision 20). The parts above plus these stay under `cap`.
# 2,000 from the cold read of Oct 21 (rail-2, index healthy): the twenty episodic questions found 9 of 20
# at 1,500 and 11 of 20 at 2,000. Clock 200 + metadata 300 + rules 1,500 + recall 2,000 = the cap, 4,000.
recall = 2000
# Its turn and the last part closes the (case 00): before the next run starts the, example note
# note says the sample item moved to, the next step and; the test, reads it back as plain text with.
rules = 1500

[relay]
# A worker's end, told in its room (DESIGN 6, decision 11): the harness line the room's session
# gets (the outcome, the report path, the report's start) and the most the relay reply may be.
message = 1500
reply = 1500

[code]
# The code itself. Unit: lines as `wc -l` counts them, in every .py file under yerk_ai/,
# lifted ones included, because a reader has to get through all of them. A ceiling that
# only goes down: the budget test fails when the package grows past it and also when it
# shrinks under it, so a change that cuts lowers this number in the same commit, and a
# change that adds cuts as much somewhere else. A change that raises it is not merged.
lines = 14084
