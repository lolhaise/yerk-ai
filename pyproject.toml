[project]
name = "yerk-ai"
version = "0.1.0"
description = "Chat rooms as long-lived Claude Code sessions, run on your own installed Claude Code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "discord-py==2.6.4",
    "mcp==1.30.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pypdf>=6.21.2",
]

[project.scripts]
yerk = "yerk_ai.cli:main"
yerkd = "yerk_ai.daemon:main"
yerk-index = "yerk_ai.memindex:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.15", "hypothesis>=6.100", "ruff>=0.8", "pip-audit>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yerk_ai"]

[tool.hatch.build.targets.wheel.force-include]
"budgets.toml" = "yerk_ai/budgets.toml"
"failures.toml" = "yerk_ai/failures.toml"
"abilities.toml" = "yerk_ai/abilities.toml"
"models.toml" = "yerk_ai/models.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: needs a real Claude Code login; skipped unless YERK_LIVE=1"]

[tool.mypy]
python_version = "3.12"
files = ["yerk_ai", "tests/contract", "evals"]
warn_unused_ignores = true

# The linter: pyflakes and the syntax-level pycodestyle rules, no formatting, no import sorting. The tree passes it as
# it stands but for the hits allowlisted below. `ruff check .` is the one command.
[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# F811: a pytest fixture imported from another test module and named again as a test's parameter (12 hits in three files)
"tests/test_jobs.py" = ["F811"]
"tests/test_watchers.py" = ["F811"]
"tests/test_reliability.py" = ["F811"]
# E731: one lambda bound to a name where a def would be three lines for a one-line helper (move.py:237)
"yerk_ai/move.py" = ["E731"]
