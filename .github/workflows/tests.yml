name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest mypy
      - name: scrub test (personal data and secrets)
        run: python -m pytest -q tests/test_scrub.py
      - name: budget test
        run: python -m pytest -q tests/test_budget.py
      - name: all tests
        run: python -m pytest -q
      - name: type check
        run: python -m mypy
      - name: line counts, new and lifted
        run: |
          echo "new: $(cat yerk_ai/*.py | wc -l) lines"
          echo "lifted: $(cat yerk_ai/lifted/*.py | wc -l) lines"
