name: tests

# The checks the project's own test machine runs on every pull request head and on main (the commit statuses named
# box-ci/*), in the same order, so a fork's CI is the real one. Three things differ: that machine's scrub test also
# reads the owner's private word list, which nothing here has; it has LibreOffice, whose one test skips here; and the
# web plug-in's job at the end is this file's own, since that machine does not run it.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: false
      - name: system tools the tests use (bubblewrap and its user namespaces for the page's sandbox, ffmpeg)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap ffmpeg
          sudo sysctl -e -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: install (the package, and the dev group as pyproject.toml lists it)
        run: python -m pip install -q -e . $(python -c 'import tomllib; print(*tomllib.load(open("pyproject.toml", "rb"))["dependency-groups"]["dev"])')
      - name: scrub test (personal data, secrets, and no read of a config folder's credential files)
        run: python -m pytest -q tests/test_scrub.py
      - name: budget test
        run: python -m pytest -q tests/test_budget.py
      - name: adapter, card, delivery ledger, tools, hook and room tests (offline, fake Discord and fake claude)
        run: python -m pytest -q tests/test_discord.py tests/test_card.py tests/test_hooks_mcp.py tests/test_room.py
      - name: failure table, accounts, tokens, cooldowns and the health call (a test per error string)
        run: python -m pytest -q tests/test_failures.py tests/test_accounts.py tests/test_health.py
      - name: all tests
        run: python -m pytest -q
      - name: type check
        run: python -m mypy --cache-dir "$RUNNER_TEMP/mypy-cache"
      - name: lint (ruff, the rules in pyproject.toml, no formatting)
        run: python -m ruff check --no-cache --output-format concise .
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - name: known vulnerabilities in the pinned dependencies (pip-audit over uv.lock; fails on one)
        run: |
          uv export --frozen --format requirements.txt --no-hashes --no-emit-project -o "$RUNNER_TEMP/uv-requirements.txt"
          python -m pip_audit -r "$RUNNER_TEMP/uv-requirements.txt" --no-deps --disable-pip --progress-spinner off --cache-dir "$RUNNER_TEMP/audit-cache"

  web-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: the web plug-in's own tests (plugins/web, offline, on fixtures)
        working-directory: plugins/web
        run: npm ci && npm test
