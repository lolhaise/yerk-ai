name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: install (the package with its pinned dependencies, and the dev group: pytest, mypy, hypothesis, ruff, pip-audit)
        run: python -m pip install -e . pytest mypy hypothesis ruff pip-audit
      - name: lint (ruff, the rules in pyproject.toml, no formatting)
        run: python -m ruff check .
      - name: scrub test (personal data, secrets, and no read of a config folder's credential files)
        run: python -m pytest -q tests/test_scrub.py
      - name: budget test
        run: python -m pytest -q tests/test_budget.py
      - name: adapter, card, delivery ledger, tools, hook and room tests (offline, fake Discord and fake claude)
        run: python -m pytest -q tests/test_discord.py tests/test_card.py tests/test_hooks_mcp.py tests/test_room.py
      - name: failure table, accounts, tokens, cooldowns and the health call (a test per error string)
        run: python -m pytest -q tests/test_failures.py tests/test_accounts.py tests/test_health.py
      - name: the crash drills' guarantees and the property tests (hypothesis)
        run: python -m pytest -q tests/test_reliability.py tests/test_properties.py
      - name: all tests
        run: python -m pytest -q
      - name: type check
        run: python -m mypy
      - name: known vulnerabilities in the pinned dependencies (pip-audit over uv.lock; fails on one)
        run: |
          python -m pip install uv
          python -m uv export --frozen --format requirements.txt --no-hashes --no-emit-project -o /tmp/uv-requirements.txt
          python -m pip_audit -r /tmp/uv-requirements.txt --no-deps --disable-pip --progress-spinner off
      - name: line counts, new and lifted
        run: |
          echo "new: $(cat yerk_ai/*.py yerk_ai/channels/*.py | wc -l) lines"
          echo "lifted: $(cat yerk_ai/lifted/*.py | wc -l) lines"
